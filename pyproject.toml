[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markflow-converter"
version = "1.0.0"
description = "轻量级Markdown与PDF双向转换工具，支持Mermaid图表渲染和中文优化"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "MarkFlow Team", email = "markflow@example.com"}
]
keywords = ["markdown", "pdf", "converter", "mermaid", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "markdown>=3.5.0",
    "pymupdf>=1.23.0",
    "pypandoc>=1.12.0",
    "jinja2>=3.1.0",
    "pygments>=2.16.0",
    "pillow>=10.0.0",
    "watchdog>=3.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
markflow = "markflow.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/markflow-converter"
Documentation = "https://github.com/yourusername/markflow-converter#readme"
Repository = "https://github.com/yourusername/markflow-converter"
Issues = "https://github.com/yourusername/markflow-converter/issues"

[tool.hatch.build.targets.wheel]
packages = ["markflow"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
